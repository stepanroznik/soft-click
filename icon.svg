<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tile with a darker bottom edge -->
  <rect x="8" y="12" width="112" height="108" rx="24" fill="#1a5fb4"/>
  <rect x="8" y="8" width="112" height="108" rx="24" fill="url(#tile)"/>

  <!-- Back window (focused, not raised) with a text selection -->
  <rect x="20" y="22" width="66" height="54" rx="7" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="28" y="31" width="44" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="26" y="39.5" width="40" height="10" rx="3" fill="#1a5fb4"/>
  <rect x="28" y="42" width="36" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="28" y="55" width="14" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Front window (stays on top) -->
  <g filter="url(#shadow)">
    <rect x="48" y="56" width="60" height="48" rx="7" fill="#ffffff"/>
  </g>
  <path d="M55 56 H101 A7 7 0 0 1 108 63 V67 H48 V63 A7 7 0 0 1 55 56 Z" fill="#deddda"/>
  <rect x="56" y="75" width="40" height="5" rx="2.5" fill="#c0bfbc"/>
  <rect x="56" y="86" width="30" height="5" rx="2.5" fill="#c0bfbc"/>

  <!-- Soft click glow -->
  <circle cx="66" cy="45" r="12" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="66" cy="45" r="6.5" fill="#ffffff" fill-opacity="0.45"/>

  <!-- Pointer, tip at the end of the selection -->
  <path transform="translate(66 45) scale(2.1)" d="M0 0 L0 18 L4.6 13.8 L7.6 20.6 L10.6 19.3 L7.7 12.6 L13.4 12.6 Z"
        fill="#241f31" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke" filter="url(#shadow)"/>
</svg>
